<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>20‑20‑20 · Eye Break Timer</title>
<meta name="description" content="A pink 20-20-20 eye break timer for your laptop. Every 20 minutes, look 20 feet away for 20 seconds." />
<meta name="theme-color" content="#ff4f9a" />

<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="icon.svg" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet" />

<link rel="stylesheet" href="styles.css" />
</head>
<body>

<div class="scene">

  <div class="petals" aria-hidden="true"></div>

  <main class="card">

    <header class="brand">
      <span class="brand-mark">20‑20‑20</span>
      <span class="brand-sub">eye break timer</span>
    </header>

    <div class="ring-wrap">
      <svg class="ring" viewBox="0 0 240 240">
        <circle class="ring-track" cx="120" cy="120" r="108"></circle>
        <circle id="ringProgress" class="ring-progress" cx="120" cy="120" r="108"></circle>
      </svg>

      <div class="ring-center">
        <div id="phaseLabel" class="phase-label">ready</div>
        <div id="timeDisplay" class="time-display">20:00</div>
        <div id="cycleCount" class="cycle-count">0 breaks today</div>
      </div>
    </div>

    <p id="breakTip" class="break-tip" role="status" aria-live="polite" hidden></p>

    <div class="week" aria-label="Breaks in the last 7 days">
      <div id="weekBars" class="week-bars"></div>
      <div id="streak" class="streak"></div>
    </div>

    <p id="hint" class="hint">Press start. Every 20 minutes we'll tell you to look 20 feet away for 20 seconds — then work resumes on its own.</p>

    <div class="controls">
      <button id="startBtn" class="btn btn-primary">Start</button>
      <button id="pauseBtn" class="btn btn-ghost" disabled>Pause</button>
    </div>

    <button id="snoozeBtn" class="link-btn" type="button" hidden>⏰ In a meeting? Snooze 5 min</button>

    <button id="stopDayBtn" class="link-btn">Stop for today</button>

    <details class="timing">
      <summary>Timing</summary>
      <div class="timing-fields">
        <label>Work for
          <input id="workMinutes" type="number" min="1" max="90" step="1" inputmode="numeric"> min
        </label>
        <label>Break for
          <input id="breakSeconds" type="number" min="10" max="300" step="5" inputmode="numeric"> sec
        </label>
      </div>
      <button id="resetTiming" class="link-btn" type="button">Reset to 20-20-20</button>
      <button id="soundToggle" class="link-btn" type="button" aria-pressed="true">🔔 Sound on</button>
    </details>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>

  </main>

  <footer class="footnote">Runs entirely in your browser. No account, no tracking, nothing leaves your laptop.</footer>

</div>

<audio id="alarmSound" preload="auto"></audio>

<script src="app.js"></script>
</body>
</html>
